<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SingleLab</title>
    <!-- استيراد الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="./assets/images/logo2.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mouse-glow" id="mouseGlow"></div>

    <!-- خلفية الجسيمات المتحركة الديناميكية -->
    <div class="animated-bg" id="particlesBg"></div>

    <!-- شريط التحكم العلوي -->
    <div class="top-controls">
        <button class="control-btn" onclick="toggleTheme()">
            <i class="fas fa-sun" id="themeIcon"></i> <span id="themeText" data-key="themeLbl">الوضع الفاتح</span>
        </button>
        <button class="control-btn" onclick="toggleLanguage()">
            <i class="fas fa-globe"></i> <span id="langText">English</span>
        </button>
    </div>

    <div class="container">
        <div class="main-card">
            <!-- شارة الحالة -->
            <div class="status-badge">
                <span class="dot"></span>
                <span data-key="status">قريباً - إطلاق المنصة الجديدة</span>
            </div>

            <!-- الشعار -->
            <div class="logo-wrapper">
                <div class="logo-frame">
                    <img src="./assets/images/logo.png" alt="SingleLab Logo">
                </div>
            </div>

            <!-- العناوين -->
            <h1>SingleLab</h1>
            <div class="tagline">We make Future</div>
            <!-- <div class="sub-tagline">Geometric Algorithm</div> -->

            <!-- الوصف التشويقي -->
            <p class="teaser-text" data-key="teaser">
                نحن نعيد تعريف الحلول البرمجية عبر خوارزميات هندسية متقدمة ودقيقة. استعد لتجربة تكنولوجية استثنائية تغير مقاييس الكفاءة والأداء.
            </p>

            <!-- العداد التنازلي -->
            <div class="countdown-container">
                <div class="countdown-box">
                    <span class="countdown-number" id="days">30</span>
                    <span class="countdown-label" data-key="daysLbl">يوماً</span>
                </div>
                <div class="countdown-box">
                    <span class="countdown-number" id="hours">00</span>
                    <span class="countdown-label" data-key="hoursLbl">ساعة</span>
                </div>
                <div class="countdown-box">
                    <span class="countdown-number" id="minutes">00</span>
                    <span class="countdown-label" data-key="minsLbl">دقيقة</span>
                </div>
                <div class="countdown-box">
                    <span class="countdown-number" id="seconds">00</span>
                    <span class="countdown-label" data-key="secsLbl">ثانية</span>
                </div>
            </div>

            <!-- نموذج الاشتراك -->
            <form id="subscribeForm" onsubmit="handleSubscription(event)">
                <div class="notify-form">
                    <input type="email" id="userEmail" data-placeholder="emailPlaceholder" placeholder="أدخل بريدك الإلكتروني ليصلك الإطلاق..." required>
                    <button type="submit" data-key="btnText">أخبرني عند الإطلاق</button>
                </div>
            </form>
            <div class="success-message" id="successMsg">
                <i class="fas fa-check-circle"></i> <span data-key="successText">تم تسجيل بريدك بنجاح! سنقوم بإعلامك فور انطلاق المنصة.</span>
            </div>

            <!-- التواصل -->
            <div class="social-links">
                <a href="#" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </div>

    <!-- كود الجافاسكريبت للخلفية المتحركة وإضاءة الماوس -->
    <script src="./script.js"></script>
</body>
</html>
